services:
  - type: web
    name: signal-os-api
    env: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    envVars:
      - key: PORT
        fromService:
          type: web
          name: signal-os-api
          envVarKey: PORT
      - key: HOST
        value: 0.0.0.0
      - key: WP_BASE_URL
        value: https://nairamusic.com
      - key: NMC_SIGNAL_KEY
        sync: false
      - key: SIGNAL_ADMIN_USERNAME
        value: naira-admin
      - key: SIGNAL_ADMIN_PASSWORD
        sync: false
