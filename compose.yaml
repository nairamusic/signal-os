services:
  signal-os:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      SIGNAL_ADMIN_USERNAME: ${SIGNAL_ADMIN_USERNAME:-naira-admin}
      SIGNAL_ADMIN_PASSWORD: ${SIGNAL_ADMIN_PASSWORD:?Set SIGNAL_ADMIN_PASSWORD}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      SUNO_API_BASE_URL: ${SUNO_API_BASE_URL:-}
      WP_BASE_URL: ${WP_BASE_URL:-https://nairamusic.com}
      WP_API_USERNAME: ${WP_API_USERNAME:-}
      WP_APPLICATION_PASSWORD: ${WP_APPLICATION_PASSWORD:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_INSTAGRAM_ACCOUNT_ID: ${META_INSTAGRAM_ACCOUNT_ID:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
    volumes:
      - signal_os_data:/app/data
volumes:
  signal_os_data:
